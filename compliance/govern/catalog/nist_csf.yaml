# NIST Cybersecurity Framework 2.0 (Feb 2024) — 106 subcategories.
# Rows: [subcategory id, category, English outcome, Chinese outcome]
id: nist_csf
name: {en: "NIST CSF 2.0", zh: "NIST 网络安全框架 2.0"}
description:
  en: "Core subcategories across Govern, Identify, Protect, Detect, Respond and Recover."
  zh: "覆盖治理、识别、保护、检测、响应、恢复六大功能的核心子类别。"
groups:
