  - [GV.RM, "Govern · Risk Management Strategy", "治理 · 风险管理策略"]
  - [GV.RR, "Govern · Roles, Responsibilities, and Authorities", "治理 · 角色、职责与权限"]
  - [GV.PO, "Govern · Policy", "治理 · 策略"]
  - [GV.OV, "Govern · Oversight", "治理 · 监督"]
  - [GV.SC, "Govern · Cybersecurity Supply Chain Risk Management", "治理 · 供应链风险管理"]
  - [ID.AM, "Identify · Asset Management", "识别 · 资产管理"]
  - [ID.RA, "Identify · Risk Assessment", "识别 · 风险评估"]
  - [ID.IM, "Identify · Improvement", "识别 · 改进"]
  - [PR.AA, "Protect · Identity Management, Authentication, and Access Control", "保护 · 身份管理、鉴别与访问控制"]
  - [PR.AT, "Protect · Awareness and Training", "保护 · 意识与培训"]
  - [PR.DS, "Protect · Data Security", "保护 · 数据安全"]
  - [PR.PS, "Protect · Platform Security", "保护 · 平台安全"]
  - [PR.IR, "Protect · Technology Infrastructure Resilience", "保护 · 基础设施韧性"]
  - [DE.CM, "Detect · Continuous Monitoring", "检测 · 持续监控"]
  - [DE.AE, "Detect · Adverse Event Analysis", "检测 · 不利事件分析"]
  - [RS.MA, "Respond · Incident Management", "响应 · 事件管理"]
  - [RS.AN, "Respond · Incident Analysis", "响应 · 事件分析"]
  - [RS.CO, "Respond · Incident Response Reporting and Communication", "响应 · 事件报告与沟通"]
  - [RS.MI, "Respond · Incident Mitigation", "响应 · 事件缓解"]
