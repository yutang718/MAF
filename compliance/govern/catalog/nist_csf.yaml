  - [GV.RR-02, GV.RR, "Cybersecurity roles, responsibilities, and authorities are established, communicated, understood, and enforced", "建立、传达并落实网络安全角色、职责和权限"]
  - [GV.RR-03, GV.RR, "Adequate resources are allocated commensurate with the cybersecurity risk strategy", "按网络安全风险策略分配足够资源"]
  - [GV.RR-04, GV.RR, "Cybersecurity is included in human resources practices", "将网络安全纳入人力资源实践"]
  - [GV.PO-01, GV.PO, "Cybersecurity risk management policy is established, communicated, and enforced", "制定、传达并执行网络安全风险管理策略"]
  - [GV.PO-02, GV.PO, "Cybersecurity policy is reviewed and updated to reflect changes in requirements, threats, and technology", "随要求、威胁和技术变化评审并更新网络安全策略"]
  - [GV.OV-01, GV.OV, "Risk management strategy outcomes are reviewed to adjust strategy and direction", "评审风险管理策略成效并调整方向"]
  - [GV.OV-02, GV.OV, "The risk management strategy is reviewed and adjusted to cover organizational requirements and risks", "评审并调整风险管理策略以覆盖组织要求和风险"]
  - [GV.OV-03, GV.OV, "Cybersecurity risk management performance is evaluated and reviewed", "评估并评审网络安全风险管理绩效"]
  - [GV.SC-01, GV.SC, "A supply chain risk management program, strategy, and policies are established", "建立网络安全供应链风险管理计划、策略和制度"]
  - [GV.SC-02, GV.SC, "Cybersecurity roles for suppliers, customers, and partners are established and coordinated", "明确并协调供应商、客户和合作伙伴的网络安全角色"]
  - [GV.SC-03, GV.SC, "Supply chain risk management is integrated into cybersecurity and enterprise risk management", "将供应链风险管理纳入网络安全和企业风险管理"]
  - [GV.SC-04, GV.SC, "Suppliers are known and prioritized by criticality", "掌握供应商并按关键程度排序"]
  - [GV.SC-05, GV.SC, "Supply chain cybersecurity requirements are integrated into contracts and agreements", "将供应链网络安全要求纳入合同和协议"]
