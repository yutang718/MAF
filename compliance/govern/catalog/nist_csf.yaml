  - [ID.AM-08, ID.AM, "Systems, hardware, software, services, and data are managed throughout their life cycles", "在全生命周期内管理系统、硬件、软件、服务和数据"]
  - [ID.RA-01, ID.RA, "Vulnerabilities in assets are identified, validated, and recorded", "识别、验证并记录资产中的漏洞"]
