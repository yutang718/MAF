  - [RC.CO, "Recover · Incident Recovery Communication", "恢复 · 恢复沟通"]
controls:
  - [GV.OC-01, GV.OC, "The organizational mission is understood and informs cybersecurity risk management", "理解组织使命并据此开展网络安全风险管理"]
