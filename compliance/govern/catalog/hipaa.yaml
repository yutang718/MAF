# HIPAA Security Rule, 45 CFR Part 164 Subpart C, as currently in force.
# Leaf requirements: implementation specifications, or the standard itself when
# it has none. (R) required, (A) addressable.
# If HHS finalises the January 2025 proposed amendments, revisit this file:
# they drop the required/addressable split and add explicit controls.
# Rows: [citation, group, English title, Chinese title]
id: hipaa
name: {en: "HIPAA Security Rule", zh: "HIPAA 安全规则"}
description:
  en: "Administrative, physical and technical safeguards for ePHI. Many requirements are procedural and need documented evidence."
  zh: "针对电子受保护健康信息（ePHI）的行政、物理和技术保障措施。很多要求属于流程类，需要书面证据。"
groups:
  - [admin, "Administrative safeguards (§164.308)", "行政保障措施（§164.308）"]
  - [physical, "Physical safeguards (§164.310)", "物理保障措施（§164.310）"]
  - [technical, "Technical safeguards (§164.312)", "技术保障措施（§164.312）"]
  - [org, "Organizational requirements (§164.314)", "组织要求（§164.314）"]
  - [docs, "Policies, procedures and documentation (§164.316)", "政策、程序与文档（§164.316）"]
controls:
