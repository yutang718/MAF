  - [DE.CM-03, DE.CM, "Personnel activity and technology usage are monitored to find potentially adverse events", "监控人员活动和技术使用以发现潜在不利事件"]
  - [DE.CM-06, DE.CM, "External service provider activities and services are monitored to find potentially adverse events", "监控外部服务商的活动和服务以发现潜在不利事件"]
