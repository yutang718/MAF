  - [GV.OC-03, GV.OC, "Legal, regulatory, and contractual cybersecurity requirements, including privacy obligations, are understood and managed", "理解并管理网络安全相关的法律、监管和合同要求（含隐私义务）"]
  - [GV.OC-04, GV.OC, "Critical objectives, capabilities, and services that external stakeholders depend on are understood and communicated", "理解并传达外部相关方依赖的关键目标、能力和服务"]
  - [GV.OC-05, GV.OC, "Outcomes, capabilities, and services that the organization depends on are understood and communicated", "理解并传达组织所依赖的成果、能力和服务"]
  - [GV.RM-01, GV.RM, "Risk management objectives are established and agreed to by organizational stakeholders", "制定风险管理目标并获得相关方认可"]
  - [GV.RM-02, GV.RM, "Risk appetite and risk tolerance statements are established, communicated, and maintained", "制定、传达并维护风险偏好和风险容忍度声明"]
  - [GV.RM-03, GV.RM, "Cybersecurity risk management is included in enterprise risk management processes", "将网络安全风险管理纳入企业风险管理流程"]
  - [GV.RM-04, GV.RM, "Strategic direction describing appropriate risk response options is established and communicated", "制定并传达描述风险应对选项的战略方向"]
