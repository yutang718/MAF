# Fluent Bit on the GitLab host: ship the logs that record clones and downloads
# to the governance ingestion endpoint. Non-download lines are ignored by the
# platform, so whole files can be sent.
#
# Replace GOVERN_HOST, CONNECTOR_ID and INGEST_TOKEN (the connector's
# "Log ingestion token"). GOVERN_HOST is the MAF address (it proxies
# /api/v1/governance), reachable from the GitLab host.

[SERVICE]
    Flush        10
    Log_Level    warn

[INPUT]
    Name         tail
    Path         /var/log/gitlab/gitlab-rails/production_json.log,/var/log/gitlab/gitlab-rails/api_json.log,/var/log/gitlab/gitlab-shell/gitlab-shell.log
    DB           /var/lib/fluent-bit/gitlab.db
    Read_from_Head false
    Mem_Buf_Limit 20MB

[OUTPUT]
    Name         http
    Match        *
    Host         GOVERN_HOST
    Port         443
    tls          On
    URI          /api/v1/governance/ingest/gitlab/CONNECTOR_ID
    Format       json_lines
    Header       Authorization Bearer INGEST_TOKEN
    json_date_key false
