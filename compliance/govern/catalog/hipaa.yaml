  - ["164.308(a)(3)(ii)(C)", admin, "Termination procedures (A)", "离职程序（可选实施）"]
  - ["164.308(a)(4)(ii)(A)", admin, "Isolating health care clearinghouse functions (R)", "隔离医疗信息交换所职能（必需）"]
  - ["164.308(a)(4)(ii)(B)", admin, "Access authorization (A)", "访问授权（可选实施）"]
