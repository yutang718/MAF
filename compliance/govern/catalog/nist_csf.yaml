  - [ID.AM-01, ID.AM, "Inventories of hardware managed by the organization are maintained", "维护组织管理的硬件清单"]
  - [ID.AM-02, ID.AM, "Inventories of software, services, and systems managed by the organization are maintained", "维护组织管理的软件、服务和系统清单"]
  - [ID.AM-03, ID.AM, "Representations of authorized network communication and data flows are maintained", "维护已授权网络通信和数据流的描述"]
  - [ID.AM-04, ID.AM, "Inventories of services provided by suppliers are maintained", "维护供应商所提供服务的清单"]
  - [ID.AM-05, ID.AM, "Assets are prioritized based on classification, criticality, and impact", "按分级、关键程度和影响对资产排序"]
